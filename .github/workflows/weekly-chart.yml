name: 13-Market Weekly Chart Shorts

# 하루 두 나라씩, 한 주에 13개국 주간 차트를 한 번씩.
#   09:00 KST (00:00 UTC) · 19:00 KST (10:00 UTC)
#   월~토 2개국 / 일요일 1개국 → 주 13편
# 수동 실행에서는 국가를 직접 고르거나 all 로 13개국을 한 번에 렌더할 수 있다.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: "auto(순번대로) / all(13개국) / 코드·목록(예: kr,us,br)"
        default: "auto"
      period:
        description: "차트 기간"
        type: choice
        options: [weekly, daily]
        default: weekly
      audio:
        description: "배경 음악"
        type: choice
        options: [preview, silent, off]
        default: preview
      upload:
        description: "유튜브 업로드: auto(공개) / skip(올리지 않음) / unlisted(미공개 테스트)"
        type: choice
        options: [auto, skip, unlisted]
        default: auto
      force_upload:
        description: "같은 주·같은 나라도 다시 업로드"
        type: boolean
        default: false
      setup_playlists:
        description: "13개국 재생목록 생성/확인 (youtube 스코프 토큰 필요)"
        type: boolean
        default: false

concurrency:
  group: weekly-chart-short
  cancel-in-progress: false

permissions:
  contents: write

env:
  # YouTube 업로드용 OAuth 토큰(JSON 한 줄). 비어 있으면 업로드 단계는 건너뛴다.
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  # 토큰에 client_id/secret 이 없을 때 채우는 용도(선택)
  YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
  # {"kr":"PL...","global":"PL..."} 형태(선택). 없으면 config/playlists.json 을 쓴다.
  YOUTUBE_PLAYLISTS_JSON: ${{ vars.YOUTUBE_PLAYLISTS_JSON }}
  AUDIO_MODE: ${{ inputs.audio || 'preview' }}
  PERIOD: ${{ inputs.period || 'weekly' }}
  # 저장소 변수 YT_PRIVACY=unlisted 로 두면 업로드 기본값이 미공개가 된다(시험 운영용).
  YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg + 다국어 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum fonts-noto-core fonts-thai-tlwg
          fc-cache -f >/dev/null
          ffmpeg -version | head -1
          fc-list | grep -i -m3 "noto sans cjk" || true

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘 차례 국가 계산
        id: target
        run: |
          TARGET="${{ inputs.country || 'auto' }}"
          if [ "$TARGET" = "auto" ]; then
            TARGET=$(python scripts/rotation.py)
          fi
          if [ -z "$TARGET" ]; then
            echo "이 시간대에는 올릴 국가가 없습니다(일요일 19:00)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "이번 차례: $TARGET"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "countries=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: 13개국 재생목록 준비 (수동 실행에서 켰을 때만)
        if: ${{ inputs.setup_playlists }}
        run: python scripts/ensure_playlists.py --print-env

      - name: 앨범 커버·미리듣기 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            cache/art
            cache/preview
            cache/meta
          key: media-${{ github.run_id }}
          restore-keys: |
            media-

      - name: 차트 수집 → 영상 렌더 → (1위 변경 시) 배경 음악 전환
        if: ${{ steps.target.outputs.skip != 'true' }}
        run: |
          python scripts/make_short.py \
            --country "${{ steps.target.outputs.countries }}" \
            --period "$PERIOD"

      - name: 차트 스냅샷·업로드 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add data state config 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore(data): $(date -u +%Y-%m-%d) 13개국 차트 스냅샷"
            git push
          fi

      - name: 결과물 업로드 (artifact)
        if: ${{ steps.target.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sori-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14

      - name: YouTube Shorts 업로드 + 나라별 재생목록
        if: ${{ steps.target.outputs.skip != 'true' && env.YOUTUBE_TOKEN_JSON != '' && inputs.upload != 'skip' }}
        run: |
          set -e
          ARGS=""
          if [ "${{ inputs.force_upload }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.upload }}" = "unlisted" ]; then ARGS="$ARGS --privacy unlisted"; fi
          python scripts/upload_youtube.py --summary output/summary.json $ARGS

      - name: 업로드 건너뛰는 경우 안내
        if: ${{ inputs.upload == 'skip' }}
        run: echo "upload=skip - 영상은 아래 artifact 에만 담았습니다(유튜브에는 올리지 않음)."

      - name: 요약
        if: always()
        run: |
          echo "### 결과" >> "$GITHUB_STEP_SUMMARY"
          cat output/summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(요약 없음)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
