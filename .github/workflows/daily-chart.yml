name: Daily Spotify Chart Short

# 매일 09:00 KST(00:00 UTC) 자동 실행 + 수동 실행(workflow_dispatch)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: "차트 지역"
        type: choice
        options: [kr, global, both]
        default: kr
      audio:
        description: "배경 음악"
        type: choice
        options: [preview, silent, off]
        default: preview

concurrency:
  group: daily-chart-short
  cancel-in-progress: false

permissions:
  contents: write

env:
  # YouTube 업로드용 OAuth 토큰(JSON 한 줄). 비어 있으면 업로드 단계는 건너뛴다.
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  AUDIO_MODE: ${{ inputs.audio || 'preview' }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg + 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum
          fc-cache -f >/dev/null
          ffmpeg -version | head -1
          fc-list | grep -i -m3 "noto sans cjk" || true

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: 앨범 커버·미리듣기 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            cache/art
            cache/preview
            cache/meta
          key: media-${{ github.run_id }}
          restore-keys: |
            media-

      - name: 차트 수집 → 영상 렌더 → (1위 변경 시) 배경 음악 전환
        run: python scripts/make_short.py --country "${{ inputs.country || 'kr' }}"

      - name: 차트 스냅샷 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경된 차트 데이터 없음"
          else
            git commit -m "chore(data): $(date -u +%Y-%m-%d) 스포티파이 차트 스냅샷"
            git push
          fi

      - name: 결과물 업로드 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sori-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14

      - name: YouTube Shorts 업로드 (토큰이 있을 때만)
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        run: |
          set -e
          for meta in output/soriplay_spotify_*.json; do
            [ -e "$meta" ] || continue
            video="${meta%.json}.mp4"
            [ -e "$video" ] || continue
            echo "업로드: $video"
            python scripts/upload_youtube.py --video "$video" --meta "$meta"
          done

      - name: 요약
        if: always()
        run: |
          echo "### 결과" >> "$GITHUB_STEP_SUMMARY"
          cat output/summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(요약 없음)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
